name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check src/ pipeline/ app/ api/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ pipeline/ app/ api/ tests/

      - name: Mypy type check
        run: uv run mypy src/ pipeline/

  test:
    name: Targeted Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Resolve tests to run
        id: resolve-tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run python scripts/ci_test_resolver.py

      - name: Run tests
        run: |
          # Only enforce the 80% floor on full-suite runs.
          # Targeted runs cover a subset of src/ so the global line rate is
          # always lower — penalising PRs for that would be misleading.
          FAIL_UNDER=""
          if [ "${{ steps.resolve-tests.outputs.run_full }}" = "true" ]; then
            FAIL_UNDER="--cov-fail-under=80"
          fi
          uv run pytest ${{ steps.resolve-tests.outputs.test_files }} \
            -v --tb=short \
            --cov=src --cov=pipeline \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            $FAIL_UNDER

      - name: Coverage summary
        run: |
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run coverage report --skip-covered --sort=cover >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post coverage comment on PR
        if: steps.resolve-tests.outputs.run_full == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage.xml', 'utf8');
            const match = coverage.match(/line-rate="([\d.]+)"/);
            const pct = match ? (parseFloat(match[1]) * 100).toFixed(1) : 'N/A';
            const bar = Math.round(parseFloat(pct) / 5);
            const filled = '█'.repeat(bar);
            const empty = '░'.repeat(20 - bar);
            const body = `## Coverage: ${pct}%\n\`${filled}${empty}\` ${pct}% / 100%\n\n> Target: 100% — currently enforcing ≥ 80%. Raise \`--cov-fail-under\` in \`pyproject.toml\` as coverage grows.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  staleness:
    name: Docs & Test Coverage Gaps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Check for stale docs and missing test files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run python scripts/ci_staleness_check.py
