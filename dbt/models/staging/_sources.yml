version: 2

sources:
  - name: raw
    description: Raw tables ingested from yfinance by the Dagster pipeline.
    schema: main
    tables:
      - name: historical_data
        description: Daily OHLCV price data per ticker.
        columns:
          - name: symbol
            tests: [not_null]
          - name: date
            tests: [not_null]
          - name: close
            tests: [not_null]

      - name: companies
        description: S&P 500 constituent metadata — sector, industry, market cap.
        columns:
          - name: symbol
            tests: [not_null, unique]

      - name: market_summaries
        description: Point-in-time market snapshot per ticker (52w hi/lo, market cap).
        columns:
          - name: symbol
            tests: [not_null, unique]

  - name: raw_observability
    description: Observability telemetry synced from SQLite by the Dagster observability_sync asset.
    schema: raw_observability
    tables:
      - name: requests
        description: One row per agent request — question, domain, latency, fallback flag.
        columns:
          - name: request_id
            tests: [not_null, unique]
      - name: spans
        description: One row per pipeline stage per request — latency and success per stage.
        columns:
          - name: id
            tests: [not_null, unique]
          - name: request_id
            tests: [not_null]
      - name: dagster_runs
        description: Dagster pipeline run history — success rate, duration, job status.
        columns:
          - name: run_id
            tests: [not_null, unique]
      - name: dbt_test_results
        description: dbt test pass/fail results written directly by dbt_test_runner asset.
        columns:
          - name: test_unique_id
            tests: [not_null]
      - name: eval_fixture_results
        description: >
          Per-fixture pass/fail results written by scripts/load_eval_results.py after
          each eval-go run. One row per fixture per run. Joined with observability
          request data in mart_eval_runs.
        columns:
          - name: fixture_id
            tests: [not_null]
          - name: run_at
            tests: [not_null]
