name: scouter
version: "1.0.0"
config-version: 2

profile: scouter

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  scouter:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: core
      equity:
        +materialized: table
        +schema: equity
      sector:
        +materialized: table
        +schema: sector
      risk:
        +materialized: table
        +schema: risk
