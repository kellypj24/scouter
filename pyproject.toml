[project]
name = "scouter"
version = "0.1.0"
description = "Financial data narrative agent — reads the power level of your data."
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.9,<2.0",
    "dagster-webserver>=1.9,<2.0",
    "dagster-dbt>=0.25,<1.0",
    "dbt-core>=1.9,<2.0",
    "dbt-duckdb>=1.9,<2.0",
    "duckdb>=1.1",
    "plotly>=5.24",
    "streamlit>=1.40",
    "pydantic>=2.9",
    "aiohttp>=3.10",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "yfinance>=1.3.0",
    "lxml>=6.1.0",
    "rich>=15.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests>=2.33.0.20260408",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipeline*", "app*", "api*"]

[tool.dagster]
module_name = "pipeline"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --cov-fail-under enforced per targeted run in CI, not globally here
addopts = "--cov=src --cov=pipeline --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
